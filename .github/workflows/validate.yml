name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

# The release script used to commit file by file, and every commit started a
# run of its own. A newer push to the same ref makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"

  validate-hassfest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "home-assistant/actions/hassfest@master"

  # The repository tests (v1.8.4): the controller, the day plan, the clusters
  # and the sample dashboards against the code, on the Home Assistant release
  # they were written for.
  tests:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v6"
        with:
          python-version: "3.13"
      - name: Install
        run: pip install homeassistant==2026.2.3 pytest==9.1.1
      - name: Tests
        run: python -m pytest -q tests
