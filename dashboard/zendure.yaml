    heading: Operation mode
    heading_style: title
    icon: mdi:state-machine
    badges:
    - type: entity
      entity: select.zendure_solarflow_3000_mix_ac_operation_mode
    - type: entity
      entity: sensor.zendure_solarflow_3000_mix_ac_controller_status
  - type: markdown
    content: |
      {% set s = states('sensor.zendure_solarflow_3000_mix_ac_controller_status') %}
      {% set a = state_attr('sensor.zendure_solarflow_3000_mix_ac_controller_status', 'reason') %}

      **Status** {{ s }} - {{ a }}

      **Direction** {{ state_attr('sensor.zendure_solarflow_3000_mix_ac_controller_status', 'direction') }} | **Target** {{ state_attr('sensor.zendure_solarflow_3000_mix_ac_controller_status', 'target_power') }} W

      **Grid** {{ state_attr('sensor.zendure_solarflow_3000_mix_ac_controller_status', 'meter_power') }} W | **Battery** {{ state_attr('sensor.zendure_solarflow_3000_mix_ac_controller_status', 'battery_power') }} W
    grid_options:
      rows: auto
      columns: full
  - type: tile
    entity: select.zendure_solarflow_3000_mix_ac_operation_mode
    icon: mdi:state-machine
    features_position: bottom
    features:
    - type: select-options
    grid_options:
      columns: 12
      rows: 2
  - type: tile
    entity: sensor.zendure_solarflow_3000_mix_ac_controller_status
    icon: mdi:cog-sync-outline
  - type: tile
    entity: switch.zendure_solarflow_3000_mix_ac_trace_recording
    vertical: false
    features_position: bottom
  - type: tile
    entity: number.zendure_solarflow_3000_mix_ac_trim_strength
    vertical: false
    features_position: bottom
  - type: tile
    entity: number.zendure_solarflow_3000_mix_ac_direction_change_delay
    vertical: false
    features_position: bottom
- type: grid
  column_span: 2
  cards:
  - type: heading
    heading: Overview
    heading_style: title
    icon: mdi:gauge
  - type: gauge
    entity: sensor.zendure_p1_meter_3_phase_grid_power_total
    min: -3000
    max: 3000
    needle: true
    severity:
      green: -1500
      yellow: 0
      red: 1500
    grid_options:
      columns: 6
      rows: auto
  - type: gauge
    entity: sensor.zendure_solarflow_3000_mix_ac_state_of_charge
    min: 0
    max: 100
    needle: true
    severity:
      green: 70
      yellow: 30
      red: 0
    grid_options:
      columns: 6
      rows: auto
  - type: gauge
    entity: sensor.zendure_solarflow_3000_mix_ac_grid_input_power
    min: 0
    max: 3000
    needle: true
    severity: &id001
      green: 0
      yellow: 1000
      red: 2000
    grid_options:
      columns: 6
      rows: auto
  - type: gauge
    entity: sensor.zendure_solarflow_3000_mix_ac_home_output_power
    min: 0
    max: 3000
    needle: true
    severity: *id001
    grid_options:
      columns: 6
      rows: auto
  - type: gauge
    entity: number.zendure_solarflow_3000_mix_ac_charge_limit_ac
    min: 0
    max: 3000
    needle: true
    severity:
      green: 2000
      yellow: 1000
      red: 0
    grid_options:
      columns: 6
      rows: auto
  - type: gauge
    entity: number.zendure_solarflow_3000_mix_ac_discharge_limit
    min: 0
    max: 3000
    needle: true
    severity: *id001
    grid_options:
      columns: 6
      rows: auto
  - type: gauge
    entity: sensor.zendure_solarflow_3000_mix_ac_charge_efficiency
    min: 0
    max: 100
    needle: true
    severity: &id002
      green: 85
      yellow: 60
      red: 0
    unit: '%'
    visibility:
    - condition: state
      entity: sensor.zendure_solarflow_3000_mix_ac_charge_efficiency
      state_not: unknown
    grid_options:
      columns: 6
      rows: auto
  - type: gauge
    entity: sensor.zendure_solarflow_3000_mix_ac_discharge_efficiency
    min: 0
    max: 100
    needle: true
    severity: *id002
    unit: '%'
    visibility:
    - condition: state
      entity: sensor.zendure_solarflow_3000_mix_ac_discharge_efficiency
      state_not: unknown
    grid_options:
      columns: 6
      rows: auto
