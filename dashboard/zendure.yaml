    vertical: false
    features_position: bottom
  - type: markdown
    content: '{% set s = states(''sensor.zendure_solarflow_3000_mix_ac_controller_status'') %}

      {% set a = state_attr(''sensor.zendure_solarflow_3000_mix_ac_controller_status'', ''reason'') %}


      **Status** {{ s }} - {{ a }}


      **Direction** {{ state_attr(''sensor.zendure_solarflow_3000_mix_ac_controller_status'', ''direction'')
      }} | **Target** {{ state_attr(''sensor.zendure_solarflow_3000_mix_ac_controller_status'', ''target_power'')
      }} W


      **Grid** {{ state_attr(''sensor.zendure_solarflow_3000_mix_ac_controller_status'', ''meter_power'')
      }} W | **Battery** {{ state_attr(''sensor.zendure_solarflow_3000_mix_ac_controller_status'', ''battery_power'')
      }} W

      '
    grid_options:
      columns: full
