# ============================================================
# ZENDURE DASHBOARD - v1.0.0 | August 2026
# ============================================================
#
# One view covering the SolarFlow 3000 Mix AC+ and the Zendure
# P1 meter, read through the zendure_restapi integration.
#
# INSTALL:
#   Paste this view under views: in a dashboard in YAML mode,
#   or open Edit dashboard -> three-dot menu -> Raw
#   configuration editor and add it there.
#
# ENTITY IDS:
#   Battery  - sensor./number./select./switch.
#              zendure_solarflow_3000_mix_ac_*
#   P1 meter - sensor.zendure_p1_meter_3_phase_*
#
#   These were derived from the device name "Zendure SolarFlow
#   3000 Mix AC+" and the entity names in the integration. Home
#   Assistant deviates on a name clash (suffix _2) or after the
#   device is renamed. Verify under Developer tools -> States,
#   filtered on "zendure".
#
# NO NAME OVERRIDES:
#   Cards carry no name: key on purpose, so every label comes
#   from the integration itself. Renaming an entity in Home
#   Assistant therefore changes the dashboard along with it, and
#   the two cannot drift apart.
#
# NOT INCLUDED:
#   PV string 3 to 6, Fan level and Fan - the zenSDK document
#   lists fanSpeed, fanSwitch and six strings, but this device
#   reports only Fanspeed, Fanmode and two strings, so those
#   entities are never created.
#   29 diagnostic entities that ship disabled, such as Grid
#   standard, Calibration interval and the timestamps. Enable
#   them in the entity registry first if you want them.
#
# ============================================================

title: Zendure
