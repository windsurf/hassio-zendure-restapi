- title: Virtual copy 1
  path: virtual_copy_1
  icon: mdi:numeric-1-box-outline
  type: sections
  max_columns: 4
  sections:
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Virtual copy 1 (simulated)
      heading_style: title
      icon: mdi:home-battery-outline
      badges:
      - type: entity
        entity: sensor.virtual_copy_1_state_of_charge
      - type: entity
        entity: sensor.virtual_copy_1_controller_status
    - type: tile
      entity: sensor.virtual_copy_1_state_of_charge
      name:
        type: entity
      icon: mdi:battery-charging
    - type: tile
      entity: sensor.virtual_copy_1_battery_power
      name:
        type: entity
      icon: mdi:flash
    - type: tile
      entity: sensor.virtual_copy_1_controller_status
      name:
        type: entity
      icon: mdi:cog-sync-outline
    - type: tile
      entity: sensor.virtual_copy_1_response_time
      name:
        type: entity
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Operation mode
      heading_style: title
      icon: mdi:state-machine
    - type: markdown
      content: |
        {% set c = 'sensor.virtual_copy_1_controller_status' %}
        **Status** {{ states(c) }} - {{ state_attr(c, 'reason') }}

        **Direction** {{ state_attr(c, 'direction') }} | **Target** {{ state_attr(c, 'target_power') }} W

        **Virtual P1** {{ state_attr(c, 'meter_power') }} W | **Battery** {{ state_attr(c, 'battery_power') }} W

        **Trim writes** {{ state_attr(c, 'trim_writes') }}
      grid_options:
        columns: full
        rows: auto
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Overview
      heading_style: title
      icon: mdi:gauge
    - type: gauge
      entity: sensor.virtual_p1_meter_grid_power
      name:
        type: entity
      min: -3000
      max: 3000
      needle: true
      grid_options:
        columns: 6
        rows: auto
      severity:
        green: -1500
        yellow: 0
        red: 1500
    - type: gauge
      entity: sensor.virtual_copy_1_state_of_charge
      name:
        type: entity
      min: 0
      max: 100
      needle: true
      grid_options:
        columns: 6
        rows: auto
      severity:
        green: 70
        yellow: 30
        red: 0
    - type: gauge
      entity: sensor.virtual_copy_1_charge_limit
      name:
        type: entity
      min: 0
      max: 3000
      needle: true
      grid_options:
        columns: 6
        rows: auto
    - type: gauge
      entity: sensor.virtual_copy_1_discharge_limit
      name:
        type: entity
      min: 0
      max: 3000
      needle: true
      grid_options:
        columns: 6
        rows: auto
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Copy settings
      heading_style: title
      icon: mdi:tune-variant
    - type: tile
      entity: number.virtual_copy_1_max_share
      name:
        type: entity
      features_position: bottom
      features:
      - type: numeric-input
        style: slider
      icon: mdi:arrow-collapse-vertical
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: number.virtual_copy_1_soc_offset
      name:
        type: entity
      features_position: bottom
      features:
      - type: numeric-input
        style: slider
      icon: mdi:battery-arrow-up-outline
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: number.virtual_copy_1_extra_response_time
      name:
        type: entity
      features_position: bottom
      features:
      - type: numeric-input
        style: slider
      icon: mdi:timer-sand
      grid_options:
        columns: 6
        rows: 2
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Measured
      heading_style: title
      icon: mdi:stethoscope
    - type: tile
      entity: sensor.virtual_copy_1_response_time
      name:
        type: entity
      icon: mdi:timer-outline
      features_position: bottom
      features:
      - type: trend-graph
        hours_to_show: 24
      grid_options:
        columns: 12
        rows: 2
