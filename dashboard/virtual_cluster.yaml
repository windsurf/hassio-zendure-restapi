# ============================================================
# VIRTUAL CLUSTER DASHBOARD - v1.8.0
# ============================================================
#
# The dashboard "Virtual Cluster" as the integration builds it
# for a Virtual cluster with three virtual copies of one real
# battery: a Cluster tab, a Price Control tab for the cluster
# and a tab per copy. The real battery keeps its own dashboard
# (dashboard/zendure_restapi.yaml).
#
# You do not need this file: the integration creates this
# dashboard itself when you add a Virtual cluster, and the
# button "Rebuild dashboard" on the Virtual cluster device
# builds it again for your own devices. This file is the
# reference of that layout, with the default entity ids.
#
# To use it by hand: Settings > Dashboards > Add dashboard,
# open it, Edit > Raw configuration editor, paste this file.
# Replace sensor.zendure_solarflow_3000_mix_ac_* with the
# battery power and state of charge of your own battery, and
# leave out the tabs of copies you do not have.
#
# The chart of today and tomorrow needs apexcharts-card (HACS).
# ============================================================

title: Virtual Cluster
views:
- title: Cluster
  path: virtual-cluster
  icon: mdi:home-battery-outline
  type: sections
  max_columns: 4
  sections:
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Virtual Cluster (simulated)
      heading_style: title
      icon: mdi:home-battery-outline
      badges:
      - type: entity
        entity: sensor.virtual_cluster_state_of_charge
      - type: entity
        entity: sensor.virtual_cluster_status
      - type: entity
        entity: select.virtual_cluster_operation_mode
    - type: tile
      entity: sensor.virtual_cluster_state_of_charge
      name:
        type: entity
      icon: mdi:battery-charging
    - type: tile
      entity: sensor.virtual_cluster_battery_power
      name:
        type: entity
      icon: mdi:flash
    - type: tile
      entity: sensor.virtual_cluster_batteries_taking_part
      name:
        type: entity
      icon: mdi:battery-sync-outline
    - type: tile
      entity: sensor.virtual_p1_meter_grid_power
      name:
        type: entity
      icon: mdi:transmission-tower
    - type: tile
      entity: sensor.virtual_p1_meter_house_load
      name:
        type: entity
      icon: mdi:home-lightning-bolt
    - type: tile
      entity: sensor.virtual_p1_meter_real_grid_power
      name:
        type: entity
      icon: mdi:transmission-tower-import
    - type: tile
      entity: sensor.price_control_virtual_cluster_status
      name: Price Control
      icon: mdi:cash-clock
    - type: tile
      entity: sensor.virtual_cluster_status
      name: Integration
      icon: mdi:tag-outline
      state_content: integration_version
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Operation mode
      heading_style: title
      icon: mdi:state-machine
      badges:
      - type: entity
        entity: select.virtual_cluster_operation_mode
      - type: entity
        entity: sensor.virtual_cluster_status
    - type: markdown
      content: |
        {% set s = 'sensor.virtual_cluster_status' %}{% set b = state_attr(s, 'batteries') or {} %}
        **Status** {{ states(s) }} – {{ state_attr(s, 'reason') }}

        **Primary** {{ state_attr(s, 'primary') or '–' }} | **Running** {{ b.values() | selectattr('limit', 'gt', 0) | list | count + (1 if state_attr(s, 'primary') else 0) }} of {{ b | count }} | **Demand** {{ state_attr(s, 'demand') }} W | **Grid at last distribution** {{ state_attr(s, 'grid') }} W

        {% set p1 = states('sensor.virtual_p1_meter_grid_power') | float(0) %}{% set house = states('sensor.virtual_p1_meter_house_load') | float(0) %}{% set lf = states('number.virtual_cluster_load_factor') | float(1) %}**Virtual P1** {{ p1 | round(0) | int }} W = house {{ house | round(0) | int }} W × {{ lf }} − copies {{ (house * lf - p1) | round(0) | int }} W | **SoC spread** {{ state_attr('sensor.virtual_cluster_state_of_charge', 'spread') }} points
      grid_options:
        columns: full
        rows: auto
    - type: tile
      entity: select.virtual_cluster_operation_mode
      name:
        type: entity
      icon: mdi:state-machine
      features_position: bottom
      features:
      - type: select-options
      grid_options:
        columns: 12
        rows: 2
    - type: tile
      entity: switch.virtual_cluster_trace_recording
      name:
        type: entity
      icon: mdi:record-rec
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Overview
      heading_style: title
      icon: mdi:gauge
    - type: gauge
      entity: sensor.virtual_p1_meter_grid_power
      name:
        type: entity
      min: -3000
      max: 3000
      needle: true
      grid_options:
        columns: 6
        rows: auto
      severity:
        green: -1500
        yellow: 0
        red: 1500
    - type: gauge
      entity: sensor.virtual_cluster_state_of_charge
      name:
        type: entity
      min: 0
      max: 100
      needle: true
      grid_options:
        columns: 6
        rows: auto
      severity:
        green: 70
        yellow: 30
        red: 0
    - type: gauge
      entity: sensor.virtual_cluster_battery_power
      name:
        type: entity
      min: -9000
      max: 9000
      needle: true
      grid_options:
        columns: 6
        rows: auto
    - type: gauge
      entity: sensor.zendure_p1_meter_3_phase_grid_power_total
      name:
        type: entity
      min: -3000
      max: 3000
      needle: true
      grid_options:
        columns: 6
        rows: auto
      severity:
        green: -1500
        yellow: 0
        red: 1500
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Distribution
      heading_style: title
      icon: mdi:call-split
    - type: markdown
      content: |-
        | Battery | Role | Direction | Limit | Power |
        |---|---|---|---:|---:|
        {% set b = state_attr('sensor.virtual_cluster_status', 'batteries') or {} %}{% set p = {"Real": "sensor.zendure_solarflow_3000_mix_ac_battery_power", "Virtual copy 1": "sensor.virtual_copy_1_battery_power", "Virtual copy 2": "sensor.virtual_copy_2_battery_power", "Virtual copy 3": "sensor.virtual_copy_3_battery_power"} %}{% for name, v in b.items() %}{% set w = states(p[name]) | float(none) if name in p else none %}{% if v.role == 'primary' %}{% set d = 'none' if w is none or (w | abs) <= 25 else ('discharge' if w > 0 else 'charge') %}| {{ name }} | primary | {{ d }} | own loop |{% else %}| {{ name }} | {{ v.role }} | {{ v.direction }} | {{ v.limit }} W |{% endif %} {{ (w | round(0) | int) ~ ' W' if w is not none else '–' }} |
        {% endfor %}
      grid_options:
        columns: full
        rows: auto
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Cluster settings
      heading_style: title
      icon: mdi:tune
    - type: tile
      entity: select.virtual_cluster_soc_protection
      name:
        type: entity
      icon: mdi:battery-lock
      features_position: bottom
      features:
      - type: select-options
      grid_options:
        columns: 12
        rows: 2
    - type: tile
      entity: number.virtual_cluster_copies
      name:
        type: entity
      features_position: bottom
      features:
      - type: numeric-input
        style: slider
      icon: mdi:content-copy
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: number.virtual_cluster_load_factor
      name:
        type: entity
      features_position: bottom
      features:
      - type: numeric-input
        style: slider
      icon: mdi:multiplication
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: number.virtual_cluster_charge_buffer
      name:
        type: entity
      features_position: bottom
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: number.virtual_cluster_discharge_buffer
      name:
        type: entity
      features_position: bottom
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: number.virtual_cluster_start_charging_at_export
      name:
        type: entity
      features_position: bottom
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: number.virtual_cluster_start_discharging_at_import
      name:
        type: entity
      features_position: bottom
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: number.virtual_cluster_stop_charging_below
      name:
        type: entity
      features_position: bottom
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: number.virtual_cluster_stop_discharging_below
      name:
        type: entity
      features_position: bottom
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: number.virtual_cluster_stop_after
      name:
        type: entity
      features_position: bottom
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: number.virtual_cluster_start_after
      name:
        type: entity
      features_position: bottom
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: number.virtual_cluster_concentrate_below
      name:
        type: entity
      features_position: bottom
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: 6
        rows: 2
    - type: tile
      entity: number.virtual_cluster_redistribute_every
      name:
        type: entity
      features_position: bottom
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: 6
        rows: 2
  - type: grid
    column_span: 4
    cards:
    - type: heading
      heading: Today and tomorrow
      heading_style: title
      icon: mdi:chart-line
    - type: custom:apexcharts-card
      graph_span: 48h
      span:
        start: day
      now:
        show: true
        label: Now
      header:
        show: false
      yaxis:
      - id: power
        min: '~-3000'
        decimals: 0
        align_to: 1500
        apex_config:
          stepSize: 1500
          labels:
            formatter: 'EVAL:function (v) { return Math.round(v) % 3000 === 0 ? Math.round(v) : ""; }'
      - id: soc
        opposite: true
        min: 0
        max: 100
        decimals: 0
        apex_config:
          tickAmount: 4
          labels:
            style:
              fontSize: 10px
      apex_config:
        chart:
          height: 240
        legend:
          show: true
        tooltip:
          x:
            format: dd-MM HH:mm
        grid:
          borderColor: rgba(127, 127, 127, 0.25)
          strokeDashArray: 0
        fill:
          type: solid
      series:
      - entity: sensor.virtual_p1_meter_grid_power
        name: Virtual P1
        type: area
        unit: W
        color: '#1E88E5'
        stroke_width: 1
        curve: monotoneCubic
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        yaxis_id: power
        statistics:
          type: mean
          period: 5minute
          align: middle
        opacity: 0.3
      - entity: sensor.virtual_cluster_battery_power
        name: Discharging
        type: area
        unit: W
        color: '#4CAF50'
        stroke_width: 1
        curve: monotoneCubic
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        yaxis_id: power
        statistics:
          type: mean
          period: 5minute
          align: middle
        opacity: 0.3
        transform: 'return x > 0 ? x : 0;'
      - entity: sensor.virtual_cluster_battery_power
        name: Charging
        type: area
        unit: W
        color: '#E53935'
        stroke_width: 1
        curve: monotoneCubic
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        yaxis_id: power
        statistics:
          type: mean
          period: 5minute
          align: middle
        opacity: 0.3
        transform: 'return x < 0 ? x : 0;'
      - entity: sensor.zendure_solarflow_3000_mix_ac_pv_input_power
        name: PV
        type: area
        unit: W
        color: '#FFB300'
        stroke_width: 1
        curve: monotoneCubic
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        yaxis_id: power
        statistics:
          type: mean
          period: 5minute
          align: middle
        opacity: 0.3
      - entity: sensor.zendure_solarflow_3000_mix_ac_battery_power
        name: Real battery
        type: line
        unit: W
        color: '#757575'
        stroke_width: 1.5
        curve: monotoneCubic
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        yaxis_id: power
        statistics:
          type: mean
          period: 5minute
          align: middle
      - entity: sensor.price_control_virtual_cluster_plan
        name: Plan (cluster)
        type: line
        unit: W
        stroke_width: 1.5
        curve: stepline
        float_precision: 0
        color: '#757575'
        show:
          in_header: false
          legend_value: false
        yaxis_id: power
        data_generator: |
          const a = entity.attributes;
          const now = Date.now();
          const pts = [[now, 0, 0]];
          [...(a.charge_periods || []), ...(a.discharge_periods || [])].forEach(r => {
            pts.push([Math.max(new Date(r.start).getTime(), now), r.power, 1]);
            pts.push([new Date(r.end).getTime(), 0, 0]);
          });
          if (a.plan_until) pts.push([new Date(a.plan_until).getTime(), 0, 0]);
          pts.sort((x, y) => x[0] - y[0] || x[2] - y[2]);
          return pts.map(p => [p[0], p[1]]);
      - entity: sensor.virtual_cluster_state_of_charge
        name: SoC cluster
        type: line
        unit: '%'
        color: '#9575CD'
        stroke_width: 2
        curve: monotoneCubic
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        yaxis_id: soc
        statistics:
          type: mean
          period: 5minute
          align: middle
        stroke_dash: 4
      - entity: sensor.zendure_solarflow_3000_mix_ac_state_of_charge
        name: SoC real
        type: line
        unit: '%'
        color: '#757575'
        stroke_width: 1.5
        curve: monotoneCubic
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        yaxis_id: soc
        statistics:
          type: mean
          period: 5minute
          align: middle
        stroke_dash: 2
      grid_options:
        columns: full
        rows: auto
      hours_12: false
- title: Price Control
  path: price-control
  icon: mdi:cash-clock
  type: sections
  max_columns: 4
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Price Control
      heading_style: title
      icon: mdi:cash-clock
      badges:
      - type: entity
        entity: sensor.price_control_virtual_cluster_status
      - type: entity
        entity: select.virtual_cluster_operation_mode
    - type: tile
      entity: switch.price_control_virtual_cluster
      name:
        type: entity
      icon: mdi:cash-clock
    - type: tile
      entity: sensor.price_control_virtual_cluster_status
      name:
        type: entity
      icon: mdi:cash-sync
    - type: tile
      grid_options:
        columns: 12
        rows: 1
      entity: select.price_control_virtual_cluster_decision
      name:
        type: entity
      icon: mdi:source-branch
      vertical: false
      features:
      - type: select-options
      features_position: inline
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Day plan
      heading_style: title
      icon: mdi:calendar-clock
      badges:
      - type: entity
        entity: sensor.price_control_virtual_cluster_plan
      - type: entity
        entity: sensor.price_control_virtual_cluster_expected_margin
    - type: tile
      entity: switch.price_control_virtual_cluster_net_metering
      name:
        type: entity
      icon: mdi:swap-horizontal
      features_position: bottom
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.price_control_virtual_cluster_plan
      name:
        type: entity
      icon: mdi:calendar-clock
    - type: tile
      entity: sensor.price_control_virtual_cluster_expected_margin
      name:
        type: entity
      icon: mdi:cash-check
  - type: grid
    column_span: 4
    cards:
    - type: markdown
      content: |
        {% set p = 'sensor.price_control_virtual_cluster_plan' %}
        {% if states(p) in ['unavailable', 'unknown'] %}
        No day plan: *Decision* is on *Fixed prices*, or there is no price list or battery data yet.
        {% else %}
        {% set nc = state_attr(p, 'next_change') %}
        {% set ns = namespace(c=[], d=[]) %}
        {% for r in state_attr(p, 'charge_periods') or [] %}{% set ns.c = ns.c + [as_timestamp(r.start) | timestamp_custom('%A %H:%M') ~ '-' ~ as_timestamp(r.end) | timestamp_custom('%H:%M')] %}{% endfor %}
        {% for r in state_attr(p, 'discharge_periods') or [] %}{% set ns.d = ns.d + [as_timestamp(r.start) | timestamp_custom('%A %H:%M') ~ '-' ~ as_timestamp(r.end) | timestamp_custom('%H:%M')] %}{% endfor %}
        **Now** {{ state_translated(p) }} | **next change** {{ as_timestamp(nc) | timestamp_custom('%H:%M') if nc else '-' }}

        **Charge** {{ ns.c | join(', ') if ns.c else '-' }}

        **Discharge** {{ ns.d | join(', ') if ns.d else '-' }}

        **Energy** {{ state_attr(p, 'charge_kwh') }} kWh in, {{ state_attr(p, 'discharge_kwh') }} kWh out | **in the battery** {{ state_attr(p, 'stored_kwh') }} of {{ state_attr(p, 'usable_kwh') }} kWh

        **Plan until** {{ as_timestamp(state_attr(p, 'plan_until')) | timestamp_custom('%A %H:%M') if state_attr(p, 'plan_until') else '-' }}
        {% endif %}
      grid_options:
        columns: full
        rows: auto
    - type: custom:apexcharts-card
      graph_span: 48h
      span:
        start: day
      now:
        show: true
        label: Now
      header:
        show: false
      yaxis:
      - id: power
        min: '~-3000'
        decimals: 0
        align_to: 1500
        apex_config:
          stepSize: 1500
          labels:
            formatter: 'EVAL:function (v) { return Math.round(v) % 3000 === 0 ? Math.round(v) : ""; }'
      - id: soc
        opposite: true
        min: 0
        max: 100
        decimals: 0
        apex_config:
          tickAmount: 4
          labels:
            style:
              fontSize: 10px
      apex_config:
        chart:
          height: 240
        legend:
          show: true
        tooltip:
          x:
            format: dd-MM HH:mm
        grid:
          borderColor: rgba(127, 127, 127, 0.25)
          strokeDashArray: 0
        fill:
          type: solid
      series:
      - entity: sensor.virtual_p1_meter_grid_power
        name: Virtual P1
        type: area
        unit: W
        color: '#1E88E5'
        stroke_width: 1
        curve: monotoneCubic
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        yaxis_id: power
        statistics:
          type: mean
          period: 5minute
          align: middle
        opacity: 0.3
      - entity: sensor.virtual_cluster_battery_power
        name: Discharging
        type: area
        unit: W
        color: '#4CAF50'
        stroke_width: 1
        curve: monotoneCubic
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        yaxis_id: power
        statistics:
          type: mean
          period: 5minute
          align: middle
        opacity: 0.3
        transform: 'return x > 0 ? x : 0;'
      - entity: sensor.virtual_cluster_battery_power
        name: Charging
        type: area
        unit: W
        color: '#E53935'
        stroke_width: 1
        curve: monotoneCubic
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        yaxis_id: power
        statistics:
          type: mean
          period: 5minute
          align: middle
        opacity: 0.3
        transform: 'return x < 0 ? x : 0;'
      - entity: sensor.zendure_solarflow_3000_mix_ac_pv_input_power
        name: PV
        type: area
        unit: W
        color: '#FFB300'
        stroke_width: 1
        curve: monotoneCubic
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        yaxis_id: power
        statistics:
          type: mean
          period: 5minute
          align: middle
        opacity: 0.3
      - entity: sensor.price_control_virtual_cluster_plan
        name: Plan
        type: line
        unit: W
        stroke_width: 1.5
        curve: stepline
        float_precision: 0
        color: '#757575'
        show:
          in_header: false
          legend_value: false
        yaxis_id: power
        data_generator: |
          const a = entity.attributes;
          const now = Date.now();
          const pts = [[now, 0, 0]];
          [...(a.charge_periods || []), ...(a.discharge_periods || [])].forEach(r => {
            pts.push([Math.max(new Date(r.start).getTime(), now), r.power, 1]);
            pts.push([new Date(r.end).getTime(), 0, 0]);
          });
          if (a.plan_until) pts.push([new Date(a.plan_until).getTime(), 0, 0]);
          pts.sort((x, y) => x[0] - y[0] || x[2] - y[2]);
          return pts.map(p => [p[0], p[1]]);
      - entity: sensor.virtual_cluster_state_of_charge
        name: SoC cluster
        type: line
        unit: '%'
        color: '#9575CD'
        stroke_width: 2
        curve: monotoneCubic
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        yaxis_id: soc
        statistics:
          type: mean
          period: 5minute
          align: middle
        stroke_dash: 4
      grid_options:
        columns: full
        rows: auto
      hours_12: false
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Pricing modes
      heading_style: title
      icon: mdi:cash-multiple
      badges:
      - type: entity
        entity: sensor.price_control_virtual_cluster_status
        icon: mdi:cash
        state_content: price_name
      - type: entity
        entity: sensor.price_control_virtual_cluster_status
        icon: mdi:format-list-bulleted
        state_content: price_format
    - type: tile
      entity: number.price_control_virtual_cluster_cheap_price
      name:
        type: entity
      icon: mdi:cash-minus
      features_position: bottom
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: 12
        rows: 2
    - type: tile
      entity: number.price_control_virtual_cluster_expensive_price
      name:
        type: entity
      icon: mdi:cash-plus
      features_position: bottom
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: 12
        rows: 2
    - type: heading
      heading: Mode per band
      heading_style: subtitle
      icon: mdi:tune-vertical
    - type: tile
      entity: select.price_control_virtual_cluster_cheap_price_mode
      name:
        type: entity
      icon: mdi:battery-arrow-up
      features_position: bottom
      features:
      - type: select-options
