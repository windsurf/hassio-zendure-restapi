      heading: Overview
      heading_style: title
      icon: mdi:gauge
    - type: gauge
      entity: sensor.zendure_p1_meter_3_phase_grid_power_total
      name:
        type: entity
      min: -3000
      max: 3000
      needle: true
      severity:
        green: -1500
        yellow: 0
        red: 1500
      grid_options:
        columns: 6
        rows: auto
    - type: gauge
      entity: sensor.zendure_solarflow_3000_mix_ac_state_of_charge
      name:
        type: entity
      min: 0
      max: 100
      needle: true
      severity:
        green: 70
        yellow: 30
        red: 0
      grid_options:
        columns: 6
        rows: auto
    - type: gauge
      entity: sensor.zendure_solarflow_3000_mix_ac_grid_input_power
      name:
        type: entity
      min: 0
      max: 3000
      needle: true
      severity:
        green: 0
        yellow: 1000
        red: 2000
      grid_options:
        columns: 6
        rows: auto
    - type: gauge
