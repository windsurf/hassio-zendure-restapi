        yellow: 60
        red: 0
      unit: '%'
      visibility:
      - condition: numeric_state
        entity: sensor.zendure_solarflow_3000_mix_ac_charge_efficiency
        above: 0
      grid_options:
        columns: 6
        rows: auto
    - type: gauge
      entity: sensor.zendure_solarflow_3000_mix_ac_discharge_efficiency
      name:
        type: entity
      min: 0
      max: 100
      needle: true
      severity:
