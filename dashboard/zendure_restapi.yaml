      name: Integration
      icon: mdi:tag-outline
      state_content: integration_version
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Operation mode
      heading_style: title
      icon: mdi:state-machine
      badges:
      - type: entity
        entity: select.zendure_solarflow_3000_mix_ac_operation_mode
      - type: entity
        entity: sensor.zendure_solarflow_3000_mix_ac_controller_status
      - type: entity
        entity: binary_sensor.zendure_solarflow_3000_mix_ac_second_controller
    - type: markdown
      content: |
        {% set c = 'sensor.zendure_solarflow_3000_mix_ac_controller_status' %}
        **Status** {{ states(c) }} - {{ state_attr(c, 'reason') }}

        **Direction** {{ state_attr(c, 'direction') }} | **Target** {{ state_attr(c, 'target_power') }} W

        **Grid** {{ state_attr(c, 'meter_power') }} W | **Battery** {{ state_attr(c, 'battery_power') }} W

        **Meter** {{ state_attr(c, 'meter_active') }} | **Foreign writes** {{ state_attr(c, 'foreign_writes') }} | **Trim writes** {{ state_attr(c, 'trim_writes') }}
      grid_options:
        rows: auto
        columns: full
    - type: tile
      entity: select.zendure_solarflow_3000_mix_ac_operation_mode
      name:
        type: entity
      icon: mdi:state-machine
      features_position: bottom
      features:
      - type: select-options
      grid_options:
        columns: 12
        rows: 2
    - type: tile
      entity: sensor.zendure_solarflow_3000_mix_ac_controller_status
      name:
        type: entity
      icon: mdi:cog-sync-outline
    - type: tile
      entity: switch.zendure_solarflow_3000_mix_ac_trace_recording
      name:
        type: entity
      vertical: false
      features_position: bottom
    - type: tile
      entity: number.zendure_solarflow_3000_mix_ac_trim_strength
      name:
        type: entity
      vertical: false
      features_position: bottom
    - type: tile
      entity: number.zendure_solarflow_3000_mix_ac_direction_change_delay
      name:
        type: entity
      vertical: false
      features_position: bottom
  - type: grid
    column_span: 2
    cards:
