- title: Price Control
  path: price-control
  icon: mdi:cash-clock
  type: sections
  max_columns: 4
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Price Control
      heading_style: title
      icon: mdi:cash-clock
      badges:
      - type: entity
        entity: sensor.price_control_status
      - type: entity
        entity: select.zendure_solarflow_3000_mix_ac_operation_mode
    - type: tile
      entity: switch.price_control
      name:
        type: entity
      icon: mdi:cash-clock
    - type: tile
      entity: sensor.price_control_status
      name:
        type: entity
      icon: mdi:cash-sync
    - type: tile
      grid_options:
        columns: 12
        rows: 1
      entity: select.price_control_decision
      name:
        type: entity
      icon: mdi:source-branch
      vertical: false
      features:
      - type: select-options
      features_position: inline
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Day plan
      heading_style: title
      icon: mdi:calendar-clock
      badges:
      - type: entity
        entity: sensor.price_control_plan
      - type: entity
        entity: sensor.price_control_expected_margin
    - type: tile
      entity: switch.price_control_net_metering
      name:
        type: entity
      icon: mdi:swap-horizontal
      features_position: bottom
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.price_control_plan
      name:
        type: entity
      icon: mdi:calendar-clock
    - type: tile
      entity: sensor.price_control_expected_margin
      name:
        type: entity
      icon: mdi:cash-check
  - type: grid
    column_span: 4
    cards:
    - type: markdown
      content: |
        {% set p = 'sensor.price_control_plan' %}
        {% if states(p) in ['unavailable', 'unknown'] %}
        No day plan: *Decision* is on *Fixed prices*, or there is no price list or battery data yet.
        {% else %}
        {% set nc = state_attr(p, 'next_change') %}
        {% set ns = namespace(c=[], d=[]) %}
        {% for r in state_attr(p, 'charge_periods') or [] %}{% set ns.c = ns.c + [as_timestamp(r.start) | timestamp_custom('%A %H:%M') ~ '-' ~ as_timestamp(r.end) | timestamp_custom('%H:%M')] %}{% endfor %}
        {% for r in state_attr(p, 'discharge_periods') or [] %}{% set ns.d = ns.d + [as_timestamp(r.start) | timestamp_custom('%A %H:%M') ~ '-' ~ as_timestamp(r.end) | timestamp_custom('%H:%M')] %}{% endfor %}
        **Now** {{ state_translated(p) }} | **next change** {{ as_timestamp(nc) | timestamp_custom('%H:%M') if nc else '-' }}

        **Charge** {{ ns.c | join(', ') if ns.c else '-' }}

        **Discharge** {{ ns.d | join(', ') if ns.d else '-' }}

        **Energy** {{ state_attr(p, 'charge_kwh') }} kWh in, {{ state_attr(p, 'discharge_kwh') }} kWh out | **in the battery** {{ state_attr(p, 'stored_kwh') }} of {{ state_attr(p, 'usable_kwh') }} kWh

        **Plan until** {{ as_timestamp(state_attr(p, 'plan_until')) | timestamp_custom('%A %H:%M') if state_attr(p, 'plan_until') else '-' }}
        {% endif %}
      grid_options:
        columns: full
        rows: auto
    - type: custom:apexcharts-card
      graph_span: 48h
      span:
        start: day
      now:
        show: true
        label: Now
      header:
        show: false
      yaxis:
      - id: power
        min: '~-3000'
        decimals: 0
        align_to: 500
        apex_config:
          stepSize: 500
          labels:
            formatter: 'EVAL:function (v) { return Math.round(v) % 1000 === 0 ? Math.round(v) : ""; }'
      - id: soc
        opposite: true
        min: 0
        max: 100
        decimals: 0
        apex_config:
          tickAmount: 4
          labels:
            style:
              fontSize: 10px
      apex_config:
        chart:
          height: 240
        legend:
          show: true
        tooltip:
          x:
            format: dd-MM HH:mm
        grid:
          borderColor: rgba(127, 127, 127, 0.25)
          strokeDashArray: 0
        fill:
          type: solid
      series:
      - entity: sensor.zendure_p1_meter_3_phase_grid_power_total
        name: Grid
        type: area
        unit: W
        color: '#1E88E5'
        opacity: 0.3
        stroke_width: 1
        curve: monotoneCubic
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        yaxis_id: power
        statistics:
          type: mean
          period: 5minute
          align: middle
      - entity: sensor.zendure_solarflow_3000_mix_ac_home_output_power
        name: Discharging
        type: area
        unit: W
        color: '#4CAF50'
        opacity: 0.3
        stroke_width: 1
        curve: monotoneCubic
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        yaxis_id: power
        statistics:
          type: mean
          period: 5minute
          align: middle
      - entity: sensor.zendure_solarflow_3000_mix_ac_grid_input_power
        name: Charging
        type: area
        unit: W
        color: '#E53935'
        opacity: 0.3
        stroke_width: 1
        curve: monotoneCubic
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        transform: return x * -1;
        yaxis_id: power
        statistics:
          type: mean
          period: 5minute
          align: middle
      - entity: sensor.zendure_solarflow_3000_mix_ac_pv_input_power
        name: PV
        type: area
        unit: W
        color: '#FFB300'
        opacity: 0.3
        stroke_width: 1
        curve: monotoneCubic
        float_precision: 0
        extend_to: now
        show:
          in_header: false
          legend_value: false
        yaxis_id: power
        statistics:
          type: mean
          period: 5minute
          align: middle
      - entity: sensor.price_control_plan
        name: Plan
        type: line
        unit: W
        stroke_width: 1.5
        curve: stepline
        float_precision: 0
        color: '#757575'
        show:
          in_header: false
          legend_value: false
        data_generator: |
          const a = entity.attributes;
          const now = Date.now();
          const pts = [[now, 0, 0]];
          [...(a.charge_periods || []), ...(a.discharge_periods || [])].forEach(r => {
            pts.push([Math.max(new Date(r.start).getTime(), now), r.power, 1]);
            pts.push([new Date(r.end).getTime(), 0, 0]);
          });
          if (a.plan_until) pts.push([new Date(a.plan_until).getTime(), 0, 0]);
          pts.sort((x, y) => x[0] - y[0] || x[2] - y[2]);
          return pts.map(p => [p[0], p[1]]);
        yaxis_id: power
      - entity: sensor.zendure_solarflow_3000_mix_ac_state_of_charge
        name: SoC
        type: line
        unit: '%'
        color: '#9575CD'
        stroke_width: 2
        curve: monotoneCubic
        float_precision: 0
        extend_to: now
        yaxis_id: soc
        show:
          in_header: false
          legend_value: false
        statistics:
          type: mean
          period: 5minute
          align: middle
        stroke_dash: 4
      grid_options:
        columns: full
        rows: auto
      hours_12: false
