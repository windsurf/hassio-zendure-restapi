- title: Price Control
  path: price-control
  icon: mdi:cash-clock
  type: sections
  max_columns: 4
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Price Control
      heading_style: title
      icon: mdi:cash-clock
      badges:
      - type: entity
        entity: sensor.price_control_status
      - type: entity
        entity: select.zendure_solarflow_3000_mix_ac_operation_mode
    - type: tile
      entity: switch.price_control
      icon: mdi:cash-clock
    - type: tile
      entity: sensor.price_control_status
      icon: mdi:cash-sync
    - type: tile
      grid_options:
        columns: 12
        rows: 1
      entity: select.price_control_decision
      icon: mdi:source-branch
      vertical: false
      features:
      - type: select-options
      features_position: inline
    - type: markdown
      content: |-
        **Decision** chooses how price control decides.

        - **Fixed prices**: at or below the *cheap price* the battery charges, at or above the *expensive price* it discharges, in between it follows the meter or rests.
        - **Day plan**: over the Nord Pool prices of today and tomorrow (the Nord Pool integration from HACS), it works out per quarter whether to charge, discharge or neither, and makes a cycle only when it earns at least the *minimum margin* per kWh after conversion losses and wear.

        Both take the modes chosen per band below: the cheap price mode, the expensive price mode, and the in-between mode for everything else. The day plan also plans with them: *quick_charge* charges from the grid, *smart_charge_only* does not; *quick_discharge* sells at full power, *smart_discharge_only* covers the house only. Switching *Decision* or *Net metering* fills the three in once with the presets for that choice; change them freely after that. Price control writes the Operation mode only when that changes, so a mode set by hand holds until then. Leave it **off** when another automation already steers the Operation mode.

        Not there yet? Add it under *Settings > Devices & services > Zendure RestAPI > Add device > Price control*, choose the battery and the price sensor, then rebuild this dashboard. Setting up Nord Pool: see *Price control* in the README.
      grid_options:
        columns: full
        rows: auto
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Day plan
      heading_style: title
      icon: mdi:calendar-clock
      badges:
      - type: entity
        entity: sensor.price_control_plan
      - type: entity
        entity: sensor.price_control_expected_margin
    - type: tile
      entity: switch.price_control_net_metering
      icon: mdi:swap-horizontal
      features_position: bottom
      grid_options:
        columns: 12
        rows: 1
    - type: tile
      entity: sensor.price_control_plan
      icon: mdi:calendar-clock
    - type: tile
      entity: sensor.price_control_expected_margin
      icon: mdi:cash-check
    - type: markdown
      content: |
        {% set p = 'sensor.price_control_plan' %}
        {% if states(p) in ['unavailable', 'unknown'] %}
        No day plan: *Decision* is on *Fixed prices*, or there is no Nord Pool price list or battery data yet.
        {% else %}
        {% set nc = state_attr(p, 'next_change') %}
        {% set ns = namespace(c=[], d=[]) %}
        {% for r in state_attr(p, 'charge_periods') or [] %}{% set ns.c = ns.c + [as_timestamp(r.start) | timestamp_custom('%A %H:%M') ~ '-' ~ as_timestamp(r.end) | timestamp_custom('%H:%M')] %}{% endfor %}
        {% for r in state_attr(p, 'discharge_periods') or [] %}{% set ns.d = ns.d + [as_timestamp(r.start) | timestamp_custom('%A %H:%M') ~ '-' ~ as_timestamp(r.end) | timestamp_custom('%H:%M')] %}{% endfor %}
        **Now** {{ state_translated(p) }} | **next change** {{ as_timestamp(nc) | timestamp_custom('%H:%M') if nc else '-' }}

        **Charge** {{ ns.c | join(', ') if ns.c else '-' }}

        **Discharge** {{ ns.d | join(', ') if ns.d else '-' }}

        **Energy** {{ state_attr(p, 'charge_kwh') }} kWh in, {{ state_attr(p, 'discharge_kwh') }} kWh out | **in the battery** {{ state_attr(p, 'stored_kwh') }} of {{ state_attr(p, 'usable_kwh') }} kWh

        **Plan until** {{ as_timestamp(state_attr(p, 'plan_until')) | timestamp_custom('%A %H:%M') if state_attr(p, 'plan_until') else '-' }}
        {% endif %}
      grid_options:
        columns: full
        rows: auto
    - type: custom:apexcharts-card
      graph_span: 24h
      span:
        start: day
      now:
        show: true
        label: Now
      header:
        show: false
      yaxis:
      - decimals: 0
      apex_config:
        chart:
          height: 240
        legend:
          show: true
        tooltip:
          x:
            format: dd-MM HH:mm
      series:
      - entity: sensor.zendure_p1_meter_3_phase_grid_power_total
        name: Grid (P1)
        type: area
        unit: W
        color: '#1E88E5'
        opacity: 0.25
        stroke_width: 2
        curve: smooth
        float_precision: 0
        extend_to: now
        group_by:
          func: avg
          duration: 5min
        show:
          in_header: false
          legend_value: false
      - entity: sensor.zendure_solarflow_3000_mix_ac_home_output_power
        name: Discharging
        type: area
        unit: W
        color: '#FFB300'
        opacity: 0.25
        stroke_width: 2
        curve: smooth
        float_precision: 0
        extend_to: now
        group_by:
          func: avg
          duration: 5min
        show:
          in_header: false
          legend_value: false
      - entity: sensor.zendure_solarflow_3000_mix_ac_grid_input_power
        name: Charging
        type: area
        unit: W
        color: '#E53935'
        opacity: 0.25
        stroke_width: 2
        curve: smooth
        float_precision: 0
        extend_to: now
        group_by:
          func: avg
          duration: 5min
        show:
          in_header: false
          legend_value: false
        transform: return x * -1;
      - entity: sensor.price_control_plan
        name: Plan
        type: line
        unit: W
        stroke_width: 2
        curve: stepline
        float_precision: 0
        color: '#757575'
        show:
          in_header: false
          legend_value: false
        data_generator: |
          const a = entity.attributes;
          const now = Date.now();
          const pts = [[now, 0, 0]];
          [...(a.charge_periods || []), ...(a.discharge_periods || [])].forEach(r => {
            pts.push([Math.max(new Date(r.start).getTime(), now), r.power, 1]);
            pts.push([new Date(r.end).getTime(), 0, 0]);
          });
          if (a.plan_until) pts.push([new Date(a.plan_until).getTime(), 0, 0]);
          pts.sort((x, y) => x[0] - y[0] || x[2] - y[2]);
          return pts.map(p => [p[0], p[1]]);
      grid_options:
        columns: 24
        rows: auto
      hours_12: false
