# ============================================================
# ZENDURE RESTAPI DASHBOARD - v1.6.2 | October 2026
# ============================================================
#
# The dashboard "Zendure RestAPI" in two views, read through
# the zendure_restapi integration. Every card uses an entity of
# the integration; nothing else is needed.
#
#   Zendure RestAPI - the battery, the Zendure P1 meter and an
#                     external P1 meter, the controller
#   Price Control   - the Price Control device: on/off, status,
#                     decision, the day plan with its periods
#                     and a chart (apexcharts-card, HACS), the
#                     fixed prices and the mode per band, the
#                     tariff, losses and margin as sliders
#                     (entity ids price_control_*)
#
# INSTALL:
#   Automatic: tick "Create the Zendure RestAPI dashboard" when
#   adding the battery, or later in its options (Configure).
#   The integration creates an editable dashboard "Zendure
#   RestAPI" with the entity ids, gauge ranges and sections of
#   your own devices. An existing one is never overwritten.
#
#   By hand: create a new dashboard, open Edit dashboard ->
#   three-dot menu -> Raw configuration editor, and replace its
#   content with everything below this comment block.
#
# ENTITY IDS:
#   Battery  - sensor./number./select./switch./binary_sensor.
#              zendure_solarflow_3000_mix_ac_*
#   P1 meter - sensor.zendure_p1_meter_3_phase_*
#   External - sensor.external_p1_meter_*
#
#   Derived from the device name "Zendure SolarFlow 3000 Mix
#   AC+" and the entity names in the integration. For another
#   model, replace zendure_solarflow_3000_mix_ac with the prefix
#   of your device. Home Assistant deviates on a name clash
#   (suffix _2) or after the device is renamed. Verify under
#   Developer tools -> States, filtered on "zendure".
#
# SECTIONS, view Zendure RestAPI:
#   Home Battery     - state of charge, power, state, SOC limit
#   Operation mode   - what the controller does and why, the
#                      mode select, controller status, trace
#                      recording, trim strength, direction delay
#   Overview         - gauges for grid, SOC, AC power, limits
#                      and the conversion efficiencies (hidden
#                      until measured)
#   Device control   - device settings, Meter source, manual
#   Controller settings, Power flow, Energy, Configuration,
#   Battery 1, System status, Diagnostics, Zendure P1 Meter
#   External P1 Meter - shown only when an external meter is
#                      configured; energy tiles only for readers
#                      with meter registers (HomeWizard,
#                      YouLess). The External meter select picks
#                      the meter the battery uses when there are
#                      several.
#
# GAUGES:
#   The power gauges run to 3000 W, the AC limit of the 3000
#   Mix AC+. The automatic dashboard takes the limit from the
#   device; by hand, lower max: to 2400 or 1600 for a 2400 AC or
#   1600 AC+, or raise it to 4000 for the 4000 Mix models.
#
# NO NAME OVERRIDES:
#   Cards carry no name: key on purpose, so every label comes
#   from the integration itself. Renaming an entity in Home
#   Assistant therefore changes the dashboard along with it, and
#   the two cannot drift apart.
#
# NOT INCLUDED:
#   PV string 3 to 6, Fan level and Fan - the zenSDK document
#   lists fanSpeed, fanSwitch and six strings, but the 3000 Mix
#   reports only Fanspeed, Fanmode and two strings, so those
#   entities are never created there.
#   Diagnostic entities that ship disabled, such as Grid
#   standard, Calibration interval and the timestamps. Enable
#   them in the entity registry first if you want them.
#
# ============================================================

