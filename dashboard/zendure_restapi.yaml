      heading: Zendure Home Battery
      heading_style: title
      icon: mdi:home-battery
      badges:
      - type: entity
        entity: sensor.zendure_solarflow_3000_mix_ac_state_of_charge
      - type: entity
        entity: sensor.zendure_solarflow_3000_mix_ac_battery_state
      - type: entity
        entity: select.zendure_solarflow_3000_mix_ac_converter_mode
    - type: tile
      entity: sensor.zendure_solarflow_3000_mix_ac_state_of_charge
      name:
        type: entity
      icon: mdi:battery-charging
    - type: tile
      entity: sensor.zendure_solarflow_3000_mix_ac_battery_power
      name:
        type: entity
      icon: mdi:flash
    - type: tile
      entity: sensor.zendure_solarflow_3000_mix_ac_battery_state
      name:
        type: entity
      icon: mdi:battery-sync
    - type: tile
      entity: sensor.zendure_solarflow_3000_mix_ac_soc_limit_status
      name:
        type: entity
      icon: mdi:battery-alert-variant-outline
    - type: tile
      entity: sensor.zendure_solarflow_3000_mix_ac_remaining_discharge_time
      name:
        type: entity
      icon: mdi:battery-clock
    - type: tile
      entity: binary_sensor.zendure_solarflow_3000_mix_ac_error
      name:
        type: entity
      icon: mdi:alert-circle-outline
    - type: tile
